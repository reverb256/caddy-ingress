name: Nix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Nix
        uses: nixos-project/nix-action/setup-pkgs@v2
        with:
          nix-version: '2.20'
          
      - name: Run flake check
        run: nix flake check
      
      - name: Run nixfmt format check
        run: nix fmt --check